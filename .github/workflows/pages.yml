name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PIMLICO_API_KEY: ${{ secrets.VITE_PIMLICO_API_KEY }}
          VITE_TURNKEY_ORGANIZATION_ID: ${{ secrets.VITE_TURNKEY_ORGANIZATION_ID }}
          VITE_TURNKEY_AUTH_PROXY_CONFIG_ID: ${{ secrets.VITE_TURNKEY_AUTH_PROXY_CONFIG_ID }}
          VITE_COPW_ADDRESS: ${{ vars.VITE_COPW_ADDRESS }}
          VITE_RENT_ADDRESS: ${{ vars.VITE_RENT_ADDRESS }}
          VITE_SALE_ADDRESS: ${{ vars.VITE_SALE_ADDRESS }}
          VITE_DISTRIBUTOR_ADDRESS: ${{ vars.VITE_DISTRIBUTOR_ADDRESS }}
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
